StylesPath = .vale/styles
Vocab = GoLab
MinAlertLevel = suggestion

# Only public, ship-facing Markdown is checked. Section globs carry a **/
# prefix because editor hooks pass files as ABSOLUTE paths: without the
# prefix, Vale matches only the relative path and checks nothing.
#
# Vale applies sections in order and a later matching section wins. The
# disable sections at the end keep research/ and plans/ unchecked even
# though their READMEs match [**/README.md].

[**/talks/*/slides/presentation.md]
BasedOnStyles = Vale
# Slide tables repeat cell values (yes, no, SDK) and the front-matter CSS
# repeats selectors such as section.section. Repetition only reports noise here.
Vale.Repetition = NO

[**/themes/golab/deck.md]
BasedOnStyles = Vale

[**/README.md]
BasedOnStyles = Vale

[**/themes/golab/README.md]
BasedOnStyles = Vale

[**/tools/README.md]
BasedOnStyles = Vale

[**/research/**]
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO
Vale.Avoid = NO

[**/plans/**]
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO
Vale.Avoid = NO
